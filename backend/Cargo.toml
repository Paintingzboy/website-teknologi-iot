[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tiberius = "0.13.0"
tower-http = { version = "0.5", features = ["cors"] }
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["compat"] }
